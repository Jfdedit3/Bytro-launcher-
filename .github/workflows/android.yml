name: Ma Galerie Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      X_LOCAL_KEYSTORE_BASE64: ${{ secrets.X_LOCAL_KEYSTORE_BASE64 }}
      X_LOCAL_KEYSTORE_PASSWORD: ${{ secrets.X_LOCAL_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore reusable Android signing key
        if: env.X_LOCAL_KEYSTORE_BASE64 != '' && env.X_LOCAL_KEYSTORE_PASSWORD != ''
        shell: bash
        run: |
          printf '%s' "$X_LOCAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/x-local-api-upload.jks"
          echo "X_LOCAL_KEYSTORE_FILE=$RUNNER_TEMP/x-local-api-upload.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build upgradeable signed release APK
        if: env.X_LOCAL_KEYSTORE_BASE64 != '' && env.X_LOCAL_KEYSTORE_PASSWORD != ''
        run: gradle --no-daemon assembleRelease

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ma-galerie-debug.apk

      - name: Rename signed release APK
        if: env.X_LOCAL_KEYSTORE_BASE64 != '' && env.X_LOCAL_KEYSTORE_PASSWORD != ''
        run: cp app/build/outputs/apk/release/app-release.apk ma-galerie-update.apk

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: ma-galerie-debug
          path: ma-galerie-debug.apk
          if-no-files-found: error

      - name: Upload signed update APK
        if: env.X_LOCAL_KEYSTORE_BASE64 != '' && env.X_LOCAL_KEYSTORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: ma-galerie-signed-update
          path: ma-galerie-update.apk
          if-no-files-found: error

      - name: Explain signing setup
        if: env.X_LOCAL_KEYSTORE_BASE64 == '' || env.X_LOCAL_KEYSTORE_PASSWORD == ''
        run: |
          echo '::warning::No persistent signing secrets configured. Debug APK may conflict with an installed APK signed with another key. Set X_LOCAL_KEYSTORE_BASE64 and X_LOCAL_KEYSTORE_PASSWORD in repository Actions secrets for upgradeable signed release APKs.'
